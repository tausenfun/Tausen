[package]
name = "tausen"
version = "0.1.0"
description = "Tausen's on-chain vault and journal: traders' USDC, operator-paid withdrawals, and every explorer entry"
edition = "2021"
rust-version = "1.84"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "tausen"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["event-cpi"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
solana-security-txt = "1.1.1"

